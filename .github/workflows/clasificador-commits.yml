name: Clasificador de commits

# Fase 06, parte 3 — la cadena nocturna: clasifica cada 3 días los commits
# que llegaron sin tipo_inferido. Corre en GitHub Actions en vez de un
# servidor propio o pg_cron, porque el clasificador ya está escrito en
# Python (STACK.md) y Supabase Edge Functions solo corre Deno.
"on":
  schedule:
    # 07:00 UTC = 2:00 AM en Colombia (UTC-5, sin horario de verano).
    # El */3 en el campo de día del mes no da un ciclo perfecto de 3 días
    # en todos los meses (reinicia en el día 1), pero para esta cadencia
    # aproximada alcanza — no es una tarea sensible al minuto.
    - cron: '0 7 */3 * *'
  # Botón "Run workflow" en la pestaña Actions, para probarlo sin esperar
  # al cron o para correrlo a mano si hace falta.
  workflow_dispatch:

jobs:
  clasificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
        working-directory: backend/agent

      # DIAGNÓSTICO TEMPORAL (2026-09-26) — curl confirmó que la red (IPv4)
      # funciona perfecto en este mismo runner; el cliente Python sigue
      # fallando igual. Esto aísla el problema a httpx2/truststore: traceback
      # completo en vez del "Connection error" genérico que el SDK envuelve.
      - run: |
          python -c "
          import traceback
          try:
              import httpx2
              r = httpx2.get('https://api.anthropic.com/v1/models', headers={'x-api-key': 'test', 'anthropic-version': '2023-06-01'}, timeout=15)
              print('OK:', r.status_code, r.text[:200])
          except Exception:
              traceback.print_exc()
          "
        working-directory: backend/agent

      - run: python -m clasificador_commits.ejecutar
        working-directory: backend/agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
